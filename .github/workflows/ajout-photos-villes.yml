name: Ajout photos villes (vague 2)

# Workflow jetable (01/10/2026) : télécharge une photo Wikimedia Commons par
# ville (liste dans photos-a-ajouter.json), l'exporte en 3200 px de large et
# met à jour manifest.json. Supprimé après usage (règle d'hygiène).

on:
  push:
    branches: ["main"]
    paths: ["photos-a-ajouter.json"]

permissions:
  contents: write

jobs:
  ajout-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Télécharger les photos et mettre à jour le manifeste
        run: python .github/scripts/ajout_photos.py

      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/ manifest.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "photos: 30 villes nouvelle fournée (Wikimedia Commons, licences et crédits dans le manifeste)"
            git pull --rebase origin main
            git push origin main
          fi
