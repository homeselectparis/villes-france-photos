name: Refait hossegor
on: workflow_dispatch
permissions:
  contents: write
jobs:
  refait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          t="Notre Dame Beach, Soorts-Hossegor.jpg"
          for w in (3200, 2560, 1920):
              url="https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(t.replace(" ","_"))+f"?width={w}"
              req=urllib.request.Request(url, headers={"User-Agent":"homeselect-photos-sync/1.0 (contact@home-select.fr)"})
              buf=urllib.request.urlopen(req, timeout=120).read()
              print(w, len(buf), buf[:2]==b"\xff\xd8", buf[-2:]==b"\xff\xd9")
              if buf[:2]==b"\xff\xd8" and buf[-2:]==b"\xff\xd9":
                  open("photos/hossegor.jpg","wb").write(buf)
                  m=json.load(open("manifest.json"))
                  for v in m["villes"]:
                      if v["slug"]=="hossegor":
                          v["octets"]=len(buf)
                          v["source"]=f"Wikimedia Commons, Fichier:{t} (export {w} px)"
                  json.dump(m, open("manifest.json","w"), encoding="utf-8", ensure_ascii=False, indent=1)
                  open("manifest.json","a").write("\n")
                  break
          else:
              raise SystemExit("aucun export valide")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos/hossegor.jpg manifest.json
          git commit -m "photos: hossegor retéléchargé (fichier tronqué au premier passage)"
          git push origin main
